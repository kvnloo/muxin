# Example: namespace-scoped K3s observation (no cluster mutation).
# Replace "agents" with your existing namespace. DO NOT paste any credentials
# into this manifest; generate a short-lived client token or use another
# organizational authentication mechanism outside this repository.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: muxin-observer
  namespace: agents
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: muxin-observer
  namespace: agents
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: muxin-observer
  namespace: agents
subjects:
  - kind: ServiceAccount
    name: muxin-observer
    namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: muxin-observer
